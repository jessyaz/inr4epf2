registry: epf_transformer
model_uid: null
run_dir: null
exp_suffix: null

seed: 0
device: auto

dataset:
  name: DE
  processed_dir: ./datasets/processed
  batch_size: 64
  num_workers: 4

window:
  lookback: 168      # 7 jetons de 24 h
  horizon: 24
  stride_train: 24   # un jeton = une journee de marche : fenetres alignees
  stride_eval: 24

masking:
  rate: 0.0
  mechanism: mcar
  block_mean: 12

train:
  num_epochs: 300
  patience: 30
  plot_every: 0
  save_checkpoint: true
  warmup_steps: 500
  grad_clip: 1.0

model:
  # hyperparametres du depot d'origine
  embedding_dim: 32
  num_heads: 8
  dim_feedforward: 128
  num_layers: 6
  normalize_first: false
  dropout: 0.2
  activation: relu

  exog_dim: 2
  imputation: linear
  use_lookback: true

  optim:
    lr: 3e-4
    weight_decay: 1e-4

pod:
  model_uid: null
  rates: [0.1, 0.2, 0.3, 0.5, 0.7, 0.9, 0.95, 1.0]
  mechanisms: [mcar, block]
  mask_seeds: [0, 1, 2, 3, 4]
  recalib_on_masked: false
  run_ablation: true
  out_dir: ./results/pod

mlflow:
  enabled: true
  force_offline: false
  experiment_name: null
  run_name: null