registry: masked_transformer
model_uid: null
run_dir: null
exp_suffix: null

seed: 0
device: auto

dataset:
  name: DE
  processed_dir: ./datasets/processed
  batch_size: 64
  num_workers: 4

window:
  lookback: 168      # un jeton par heure
  horizon: 24
  stride_train: 6    # aucune contrainte d'alignement journalier
  stride_eval: 24

masking:
  rate: 0.0
  mechanism: mcar
  block_mean: 12

train:
  num_epochs: 300
  patience: 30
  plot_every: 0
  save_checkpoint: true
  warmup_steps: 500
  grad_clip: 1.0
  loss: l1                   # CORRIGÉ : aligné sur L1

model:
  masked_attention: true
  imputation: none           # CORRIGÉ : pas d'imputation, masquage natif dans l'attention

  # Alignement exact sur ~1,01 M de paramètres (comme l'INR)
  embedding_dim: 192         # CORRIGÉ
  num_heads: 6               # CORRIGÉ
  dim_feedforward: 512       # CORRIGÉ
  num_layers: 3              # CORRIGÉ
  normalize_first: true
  dropout: 0.1
  activation: gelu

  exog_dim: 2
  use_lookback: true

  optim:
    lr: 1e-4
    weight_decay: 1e-4

pod:
  model_uid: null
  rates: [0.1, 0.2, 0.3, 0.5, 0.7, 0.9, 0.95, 1.0]
  mechanisms: [mcar, block]
  mask_seeds: [0, 1, 2, 3, 4]
  recalib_on_masked: false
  run_ablation: true
  out_dir: ./results/pod

mlflow:
  enabled: true
  force_offline: false
  experiment_name: null
  run_name: null